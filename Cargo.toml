[package]
name = "pixel_pilfer"
version = "0.1.0"
description="Demo of an algorithm for procedurally generating an image by stealing pixels from another image"
edition = "2024"

[dependencies]
winit = "0.30.13"
softbuffer = "0.4.8"
image = {
	version = "0.25.10",
	default-features = false,
	features = [
	  "jpeg",
	  "png",
	  "bmp",
	  "tiff",
	  "webp",
	]
}
fontdue = "0.9.4"
rand = "0.10.2"
rfd = "0.17.2"
clap = {version="4.6.6", features=["derive"]}

[profile.release]
opt-level = 3
lto = true
panic = "abort" # Reduces binary size ~1.5MB
strip = true    # Another ~2MB

